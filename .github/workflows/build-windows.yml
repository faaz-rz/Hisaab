name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'

      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - run: dart run tooling/bundle_windows_sqlite.dart

      - name: Verify release bundle
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          $exe = Join-Path $release "HISAAB.exe"
          $data = Join-Path $release "data"

          if (!(Test-Path $exe)) {
            throw "Missing Windows executable: $exe"
          }

          if (!(Test-Path $data)) {
            throw "Missing Flutter data folder: $data"
          }

          if (!(Test-Path (Join-Path $release "sqlite3.dll"))) {
            throw "Missing SQLite runtime"
          }

          Get-ChildItem $release | Format-Table Name, Length

      - name: Smoke launch Windows app
        shell: pwsh
        run: |
          $exe = Resolve-Path "build/windows/x64/runner/Release/HISAAB.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10

          if ($process.HasExited) {
            throw "Windows app exited during smoke launch with code $($process.ExitCode)"
          }

          Stop-Process -Id $process.Id -Force
          Write-Host "Windows smoke launch passed."

      - uses: actions/upload-artifact@v4
        with:
          name: Hisaab-Windows
          path: build/windows/x64/runner/Release/**
